<svg width="720" height="520" viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">InsightML predictive analytics illustration</title>
  <desc id="desc">A machine learning pipeline diagram showing feature engineering, model training, evaluation, and API deployment.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#09141f"/>
      <stop offset="100%" stop-color="#10192d"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="720" height="520" rx="28" fill="url(#bg3)"/>
  <circle cx="160" cy="396" r="110" fill="#7dd3fc" opacity="0.08"/>
  <circle cx="574" cy="122" r="104" fill="#8b5cf6" opacity="0.08"/>

