  <text x="470" y="108" fill="#dfeafc" font-size="20" font-family="Arial, sans-serif">Model</text>
  <text x="454" y="136" fill="#9db4d0" font-size="14" font-family="Arial, sans-serif">Training</text>

  <path d="M208 118 H242 M398 118 H430" stroke="#7dd3fc" stroke-width="3" stroke-dasharray="8 8" fill="none"/>

